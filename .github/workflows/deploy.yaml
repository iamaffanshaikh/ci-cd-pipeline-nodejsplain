name : Deploy on EC2 Machine 

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            eval "$(ssh-agent -s)"
            ssh-add ~/private
            ssh -T git@github.com
            git pull origin master
            docker compose down 
            docker compose up -d